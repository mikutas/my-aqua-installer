name: my-aqua-installer
description: 'checkout>aqua-installer'
inputs:
  aqua_opts:
    description: https://aquaproj.github.io/docs/products/aqua-installer/
    required: false
    default: "-l"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.64.0
        aqua_opts: ${{ inputs.aqua_opts }}
